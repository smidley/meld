version: "3"

env:
  PYTHONPATH: src

tasks:
  test:
    desc: Run the unit test suite
    cmds:
      - uv run pytest -q

  test:smoke:
    desc: Run opt-in smoke tests against real CLIs (Plan 2)
    cmds:
      - MELD_SMOKE=1 uv run pytest tests/smoke -q -p no:cacheprovider

  status:
    desc: Print the board for the current party (MELD_GROUP / MELD_ROLE from env)
    cmds:
      - uv run meld status

  run:
    desc: Supervise a group's orchestrator and PM (GROUP=claude|codex)
    cmds:
      - uv run meld run {{.GROUP}}

  up:
    desc: Start a group's supervisor in the background (GROUP=claude|codex); `task ps` shows it, `task down` stops it
    cmds:
      - uv run meld run {{.GROUP}} --detach

  down:
    desc: Stop a group's background supervisor (GROUP=claude|codex)
    cmds:
      - uv run meld stop {{.GROUP}}

  ps:
    desc: Each group's supervisor and roles, alive or not, from the local records
    cmds:
      - uv run meld --pretty ps

  doctor:
    desc: Verify CLIs, tokens, identities, models, and permissions (CLI_ARGS for flags, e.g. --probe-status)
    cmds:
      - uv run meld doctor {{.CLI_ARGS}}

  setup:
    desc: Bootstrap a product repo (REPO=owner/name GOAL="..."; CLI_ARGS for flags, e.g. --pr)
    requires:
      vars: [REPO, GOAL]
    cmds:
      - uv run meld setup {{.REPO}} --goal "{{.GOAL}}" {{.CLI_ARGS}}
